<!-- =========================================================
     Header
     用意：
     1. 全站共用 Header
     2. Logo 品牌區
     3. 桌機版主選單
     4. 手機版漢堡 Menu
========================================================= -->

<header class="top-header">

  <!-- =======================================================
       Container
       用意：
       Bootstrap 滿版容器
  ======================================================== -->
  <div class="container-fluid">

    <!-- =====================================================
         Header Inner
         用意：
         控制 Header 最大寬度與置中
    ====================================================== -->
    <div class="header-inner">

      <!-- ===================================================
           Logo Area
           用意：
           點擊 Logo 回首頁
      ==================================================== -->
      <!-- 使用站內根路徑，不綁定特定網域，方便整個專案重新部署。 -->
      <a href="/index.html" class="logo-wrap">
        <!-- =================================================
             Nine9 Logo
        ================================================== -->
        <img src="https://nine9.jic-tools.com.tw/themes/nine9/images/logo.png" alt="Nine9 Logo" />

        <!-- =================================================
             Logo Text
        ================================================== -->
        <div class="logo-text">

          <div class="logo-title">
            Support Center
          </div>

          <div class="logo-sub">
            Technical Support Portal
          </div>

        </div>

      </a>

      <!-- ===================================================
           Mobile Menu Button
           用意：
           手機版漢堡選單按鈕
      ==================================================== -->
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open Menu">

        <!-- 內嵌圖示，避免頁面未載入外部圖示字型時手機選單顯示空白。 -->
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M2 4a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 4m0 4a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8m.5 3.5a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1z"/></svg>

      </button>

      <!-- ===================================================
           Navigation
      ==================================================== -->
      <nav class="top-nav" id="topNav">

        <a href="/nine9/products.html">
          Products
        </a>

        <a href="/CuttingData/index.html">
          Cutting Data
        </a>

        <a href="/NCProgram/index.html">
          NC Program
        </a>

         <a href="/News/index.html">
          News
        </a>

        <a href="/ContactUs/index.html">
          Contact Us
        </a>



        <a href="https://nine9.jic-tools.com.tw/" target="_blank">
          Global
          Website
        </a>

      </nav>

    </div>

  </div>

</header>

<!-- =========================================================
     Mobile Menu Script
     用意：
     點擊漢堡按鈕展開 Menu
========================================================= -->
<script>

  const mobileMenuBtn =
    document.getElementById("mobileMenuBtn");

  const topNav =
    document.getElementById("topNav");

  /* =========================================================
     點擊漢堡按鈕
  ========================================================= */

  mobileMenuBtn.addEventListener("click", () => {

    topNav.classList.toggle("active");

  });

</script>
