<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nine9 Tech Center | Products</title>

  <!-- Bootstrap 5：負責 RWD Grid / 基礎元件 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome：負責簡易線性圖示 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Products Card 專用樣式 -->
  <link rel="stylesheet" href="css/products.css">
  
  <link rel="stylesheet" href="../header/header.css">
  <link rel="stylesheet" href="../footer/footer.css">


  <!-- 全站共用的 iPhone／iPad 主畫面圖示。 -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>

<body>
    <!-- Header -->
  <div id="header-placeholder"></div>

  <main class="products-page">
    <div class="container-fluid products-container">
      <!-- <h1 class="products-title">Products</h1> -->

      <!-- JS 會自動把產品分類 Card 插入這裡 -->
      <section class="row g-4" id="productsGrid" aria-label="Products"></section>
    </div>
  </main>

  <!-- Footer 插入位置：一定要有這行 -->
  <div id="footer-placeholder"></div>
  
  <!-- 產品資料：未來要新增/刪除/修改分類，主要改這支檔案 -->
  <script src="js/products-data.js"></script>

  <!-- 產品渲染：負責把資料變成 HTML Card -->
  <script src="js/products-render.js"></script>

<script>
/* =========================================================
   Header Loader
   用意：
   載入共用 Header，並在載入完成後綁定手機選單按鈕
========================================================= */

fetch('../header/header.html?v=20260520-news')
  .then(response => response.text())
  .then(data => {

    document.getElementById('header-placeholder').innerHTML = data;

    /* =====================================================
       Mobile Menu Toggle
       用意：
       Header 被插入頁面後，才找得到 mobileMenuBtn / topNav
    ====================================================== */

    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const topNav = document.getElementById('topNav');

    if (mobileMenuBtn && topNav) {

      mobileMenuBtn.addEventListener('click', function () {

        topNav.classList.toggle('active');

      });

    }

  });

/* =========================================================
   Footer Loader
========================================================= */

fetch('../footer/footer.html')
  .then(response => response.text())
  .then(data => {

    document.getElementById('footer-placeholder').innerHTML = data;

  });
</script>
</body>

</html>
