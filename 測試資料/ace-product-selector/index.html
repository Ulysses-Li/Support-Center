<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACE Spot Drill｜互動式產品選型樣板</title>
  <link rel="icon" href="../../favicon.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../header/header.css">
  <link rel="stylesheet" href="../../footer/footer.css">
  <link rel="stylesheet" href="../../css/site-background.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <div id="header-placeholder"></div>

  <main class="selector-page flex-grow-1">
    <div class="selector-shell">
      <!-- 頁面標題：說明這是從型錄規格整理出的產品選型工具。 -->
      <header class="selector-heading">
        <div>
          <p class="eyebrow">NINE9 PRODUCT SELECTOR</p>
          <h1>ACE Spot Drill</h1>
          <p class="lead">選擇刀片尺寸、角度、材質與刀桿形式，即時取得料號與完整規格。</p>
        </div>
        <a class="catalog-link" href="../../Products/AceSpotDrill/ACE-Spot-Drill-Catalog.pdf" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 0A1.5 1.5 0 0 0 3 1.5v13A1.5 1.5 0 0 0 4.5 16h7a1.5 1.5 0 0 0 1.5-1.5V4.707a1.5 1.5 0 0 0-.44-1.06L9.354.439A1.5 1.5 0 0 0 8.293 0H4.5zm4 1.5v2A1.5 1.5 0 0 0 10 5h2v9.5a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 .5-.5h4z"/></svg>
          查看原始型錄
        </a>
      </header>

      <div class="workspace">
        <!-- 左側輸入區：所有產品條件集中在單一表單。 -->
        <form class="selection-panel" id="selectorForm">
          <div class="panel-label"><span>01</span>選擇條件</div>

          <label class="field">
            <span>刀片尺寸</span>
            <select id="insertSize"></select>
            <small id="sizeHint"></small>
          </label>

          <fieldset class="angle-field">
            <legend>刀片角度</legend>
            <div class="angle-options" id="angleOptions"></div>
            <small id="angleHint"></small>
          </fieldset>

          <label class="field">
            <span>加工材質／刀片牌號</span>
            <select id="grade"></select>
            <small id="gradeHint"></small>
          </label>

          <label class="field">
            <span>刀桿形式</span>
            <select id="holderType">
              <option value="cylindrical">Cylindrical Shank｜直柄</option>
              <option value="screwFit">Screw Fit Cutter｜螺牙式</option>
            </select>
          </label>

          <label class="field">
            <span>預計點鑽直徑 Ød（mm）</span>
            <input id="spotDiameter" type="number" min="0.1" step="0.1" inputmode="decimal">
            <small id="diameterHint">不可超過所選刀片的 Dmax。</small>
          </label>
        </form>

        <!-- 右側結果區：規格隨表單選項即時更新。 -->
        <section class="result-panel" aria-live="polite">
          <div class="panel-label"><span>02</span>選型結果</div>

          <div class="result-hero">
            <div>
              <span class="result-kicker">INSERT</span>
              <h2 id="insertPartNumber">-</h2>
              <p id="applicationText">-</p>
            </div>
            <div class="angle-badge" id="angleBadge">90°</div>
          </div>

          <div class="result-grid">
            <div><span>訂購代碼</span><strong id="insertCode">-</strong></div>
            <div><span>牌號／鍍層</span><strong id="coating">-</strong></div>
            <div><span>Dmax.</span><strong id="dmax">-</strong></div>
            <div><span>Tmax.</span><strong id="tmax">-</strong></div>
            <div><span>尺寸 S</span><strong id="insertS">-</strong></div>
            <div><span>尺寸 CT</span><strong id="insertCt">-</strong></div>
            <div><span>每盒數量</span><strong id="boxQty">-</strong></div>
            <div><span>預估點鑽深度 t</span><strong id="spotDepth">-</strong></div>
          </div>

          <section class="holder-result">
            <div class="holder-heading">
              <div>
                <span class="result-kicker">MATCHED HOLDER</span>
                <h3 id="holderName">-</h3>
              </div>
              <span class="coolant-pill">Internal coolant</span>
            </div>
            <dl class="holder-specs" id="holderSpecs"></dl>
          </section>

          <aside class="result-note">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.41-2.29 2.29-.86-.86a.5.5 0 0 0-.71.71l1.21 1.21a.5.5 0 0 0 .71 0l2.64-2.64a.5.5 0 1 0-.7-.71z"/></svg>
            <p id="selectionNote">規格取自 ACE Spot Drill 型錄第 16–19 頁，訂購前請再次確認應用條件。</p>
          </aside>
        </section>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="./app.js"></script>
</body>
</html>
