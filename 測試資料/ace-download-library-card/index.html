<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACE Spot Drill｜精簡下載樣板</title>
  <link rel="icon" href="../../favicon.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- 模擬正式網站的共用頁首，方便直接比較整體比例。 -->
  <header class="demo-header">
    <a class="brand" href="../../index.html" aria-label="回到 Support Center 首頁">
      <img src="../../assets/images/jimmore-nine9-logo.png" alt="Nine9">
      <span><strong>Support Center</strong><small>Technical Support Portal</small></span>
    </a>
    <span class="demo-tag">DESIGN STUDY 02</span>
  </header>

  <main class="page-shell">
    <!-- 標題只保留必要資訊，避免搶走下載項目的焦點。 -->
    <header class="page-heading">
      <p>ACE SPOT DRILL</p>
      <h1>Catalog &amp; Cutting Data</h1>
    </header>

    <section class="download-list" aria-label="ACE Spot Drill 下載資源">
      <!-- 有檔案的項目：封面、說明與下載動作整合在同一層。 -->
      <article class="download-row download-row--ready">
        <a class="cover-link" href="../../Products/AceSpotDrill/ACE-Spot-Drill-Catalog.pdf" target="_blank" rel="noopener" aria-label="預覽 ACE Spot Drill Catalog PDF">
          <img src="../../Products/AceSpotDrill/downloads/ACE-Spot-Drill-Catalog-cover.jpg" alt="ACE Spot Drill Catalog 封面">
          <span>PDF</span>
        </a>
        <div class="resource-copy">
          <span class="resource-type">01 / CATALOG</span>
          <h2>ACE Spot Drill Catalog</h2>
          <p>產品規格、刀具特色與選用資訊</p>
          <div class="resource-meta"><span>PDF</span><span>10 pages</span></div>
        </div>
        <a class="download-action" href="../../Products/AceSpotDrill/ACE-Spot-Drill-Catalog.pdf" target="_blank" rel="noopener">
          <span>Preview</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M.5 9.9a.5.5 0 0 1 .5.5h4.5a.5.5 0 0 1 0 1H1a.5.5 0 0 1-.5-.5zm7-9.4a.5.5 0 0 1 1 0v8.8l2.15-2.15a.5.5 0 1 1 .7.7l-3 3a.5.5 0 0 1-.7 0l-3-3a.5.5 0 1 1 .7-.7L7.5 9.3V.5z"/></svg>
        </a>
      </article>

      <!-- 尚未提供的項目：維持相同結構，但不顯示無效下載按鈕。 -->
      <article class="download-row download-row--pending">
        <div class="pending-preview" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M5 4a3 3 0 1 1 6 0v1h.5A1.5 1.5 0 0 1 13 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 14.5v-8A1.5 1.5 0 0 1 4.5 5H5V4zm1 1h4V4a2 2 0 1 0-4 0v1z"/></svg>
          <span>DATA</span>
        </div>
        <div class="resource-copy">
          <span class="resource-type">02 / CUTTING DATA</span>
          <h2>Cutting Data</h2>
          <p>切削條件與建議參數</p>
          <div class="resource-meta"><span>整理中</span></div>
        </div>
        <span class="pending-action">Coming soon</span>
      </article>
    </section>
  </main>
</body>
</html>
