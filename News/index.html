<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nine9 Tech Center | News</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../header/header.css">
  <link rel="stylesheet" href="../footer/footer.css">
  <link rel="stylesheet" href="./news.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <div id="header-placeholder"></div>

  <main class="news-page flex-grow-1">
    <section class="news-hero" aria-labelledby="newsTitle">
      <span>News</span>
      <h1 id="newsTitle">Nine9 Latest News</h1>
      <p>Read the latest Nine9 announcements, product applications, exhibition updates, and machining stories.</p>
    </section>

    <section class="news-workspace" aria-label="Nine9 news list">
      <div class="news-shell">
        <div class="section-heading">
          <h2>News Updates</h2>
          <a href="https://nine9.jic-tools.com.tw/news.htm" target="_blank" rel="noopener">Official news page</a>
        </div>

        <div class="news-grid" id="newsGrid"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="./news.js"></script>
  <script>
    fetch("../header/header.html?v=20260520-news")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header-placeholder").innerHTML = data;

        const mobileMenuBtn = document.getElementById("mobileMenuBtn");
        const topNav = document.getElementById("topNav");

        if (mobileMenuBtn && topNav) {
          mobileMenuBtn.addEventListener("click", function () {
            topNav.classList.toggle("active");
          });
        }
      });

    fetch("../footer/footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  </script>
</body>
</html>
