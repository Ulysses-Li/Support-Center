<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nine9 Tech Center | Product Videos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../header/header.css">
  <link rel="stylesheet" href="../footer/footer.css">
  <link rel="stylesheet" href="./product-videos.css">
  <!-- 全站共用的 iPhone／iPad 主畫面圖示。 -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>

<body class="d-flex flex-column min-vh-100">
  <div id="header-placeholder"></div>

  <main class="product-videos-page flex-grow-1">
    <section class="videos-hero" aria-labelledby="videosTitle">
      <span>Product Videos</span>
      <h1 id="videosTitle">Select product first</h1>
      <p>Choose a product to view planning and marketing videos, application footage, and product introduction resources.</p>
    </section>

    <section class="videos-workspace" aria-label="Product video selector">
      <div class="product-selector">
        <div class="section-heading">
          <h2>Product Options</h2>
          <p>Video resources by product.</p>
        </div>

        <div class="video-product-grid" id="videoProductGrid"></div>
      </div>

    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="./product-videos.js"></script>
  <script>
    fetch("../header/header.html?v=20260520-news")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header-placeholder").innerHTML = data;

        const mobileMenuBtn = document.getElementById("mobileMenuBtn");
        const topNav = document.getElementById("topNav");

        if (mobileMenuBtn && topNav) {
          mobileMenuBtn.addEventListener("click", function () {
            topNav.classList.toggle("active");
          });
        }
      });

    fetch("../footer/footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  </script>
</body>
</html>
